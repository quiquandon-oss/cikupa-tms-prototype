<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roca Cikupa TMS – Prototype</title>

  <!-- CSS Engine -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-100">

  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // Simulated SAP Business One Data
    const FLEET_TYPES = {
      CDE:     { label: 'CDE / Pickup', maxWeight: 2.5,  color: 'bg-emerald-700' },
      CDD:     { label: 'CDD',          maxWeight: 6.0,  color: 'bg-slate-800' },
      FUSO:    { label: 'Fuso',         maxWeight: 8.0,  color: 'bg-indigo-800' },
      TRONTON: { label: 'Tronton',      maxWeight: 20.0, color: 'bg-amber-800' }
    };

    const mockUnassignedOrders = [
      { id: 'O-101', customer: 'PT Maju Jaya',       weight: 1.5, zone: 'Jakarta Core', address: 'Jl. Gatot Subroto No. 12, Jakarta',   gangFlag: false },
      { id: 'O-102', customer: 'Toko Abadi',         weight: 3.0, zone: 'West Java',    address: 'Jl. Raya Sukabumi KM 8, Cianjur',     gangFlag: false },
      { id: 'O-103', customer: 'CV Sempit',          weight: 0.8, zone: 'Jakarta Core', address: 'Gang Melati III No. 5, Kebon Jeruk',  gangFlag: true  },
      { id: 'O-104', customer: 'Roca Retail Cikupa', weight: 2.0, zone: 'Jakarta Core', address: 'Jl. Raya Cikupa No. 1, Tangerang',    gangFlag: false }, // NOTE: address inferred — original commit was truncated here, confirm with source
    ];

    const initialFleet = [
      { id: 'CDD-B1234', type: 'CDD', maxWeight: 6.0, currentWeight: 0, zone: 'Jakarta Core', orders: [], isDirty: false },
      { id: 'CDE-B9988', type: 'CDE', maxWeight: 2.5, currentWeight: 0, zone: 'Jakarta Core', orders: [], isDirty: false }
    ];

    function TMSBoard() {
      const [unassigned, setUnassigned] = useState(mockUnassignedOrders);
      const [fleet, setFleet] = useState(initialFleet);
      const [recalcNeeded, setRecalcNeeded] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');

      const handleDragStart = (e, order, sourceId) => {
        e.dataTransfer.setData('application/json', JSON.stringify({ order, sourceId }));
        setErrorMsg('');
      };

      const handleDragOver = (e) => e.preventDefault();

      const handleDrop = (e, targetTruckId) => {
        e.preventDefault();
        const data = e.dataTransfer.getData('application/json');
        if (!data) return;

        const { order, sourceId } = JSON.parse(data);
        if (sourceId === targetTruckId) return;

        let updatedUnassigned = [...unassigned];
        let updatedFleet = JSON.parse(JSON.stringify(fleet));

        const targetTruckIndex = updatedFleet.findIndex(t => t.id === targetTruckId);

        // --- LOGISTICS CONSTRAINT ENGINE ---
        if (targetTruckId !== 'unassigned') {
          const targetTruck = updatedFleet[targetTruckIndex];

          // 1. Gang Restriction
          if (order.gangFlag && targetTruck.type !== 'CDE') {
            setErrorMsg(`❌ Rejected: Order ${order.id} requires CDE access (Gang restricted).`);
            return;
          }

          // 2. Capacity Restriction
          if (targetTruck.currentWeight + order.weight > targetTruck.maxWeight) {
            setErrorMsg(`❌ Rejected: Adding ${order.weight}T exceeds ${targetTruck.id} capacity.`);
            return;
          }

          targetTruck.orders.push(order);
          targetTruck.currentWeight = parseFloat((targetTruck.currentWeight + order.weight).toFixed(2));
          targetTruck.isDirty = true;
          setRecalcNeeded(true);
        } else {
          updatedUnassigned.push(order);
        }

        if (sourceId === 'unassigned') {
          updatedUnassigned = updatedUnassigned.filter(o => o.id !== order.id);
        } else {
          const sourceTruck = updatedFleet.find(t => t.id === sourceId);
          sourceTruck.orders = sourceTruck.orders.filter(o => o.id !== order.id);
          sourceTruck.currentWeight = parseFloat((sourceTruck.currentWeight - order.weight).toFixed(2));
          sourceTruck.isDirty = true;
          setRecalcNeeded(true);
        }

        setUnassigned(updatedUnassigned);
        setFleet(updatedFleet);
      };

      const handleRecalculate = () => {
        const cleanFleet = fleet.map(truck => ({ ...truck, isDirty: false }));
        setFleet(cleanFleet);
        setRecalcNeeded(false);
      };

      return (
        <div className="p-6 font-sans max-w-7xl mx-auto">
          <div className="flex justify-between items-center mb-6 border-b-2 border-slate-300 pb-4">
            <div>
              <h1 className="text-3xl font-bold text-slate-800">Roca Cikupa Dispatch</h1>
              <p className="text-slate-500 text-sm mt-1">Prototype Build 1.1</p>
              {errorMsg && <p className="text-red-600 font-semibold mt-2 animate-pulse">{errorMsg}</p>}
            </div>
            <button
              onClick={handleRecalculate}
              disabled={!recalcNeeded}
              className={`px-6 py-3 rounded-lg font-bold shadow-md transition-all ${recalcNeeded ? 'bg-blue-600 text-white hover:bg-blue-700 animate-pulse' : 'bg-slate-300 text-slate-500 cursor-not-allowed'}`}
            >
              {recalcNeeded ? '⚠️ Recalculate Routes' : 'Routes Optimized'}
            </button>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">

            {/* Unassigned Zone */}
            <div
              className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 min-h-[500px]"
              onDragOver={handleDragOver}
              onDrop={(e) => handleDrop(e, 'unassigned')}
            >
              <h2 className="font-bold text-lg mb-4 text-slate-700 flex justify-between items-center">
                Unassigned Queue
                <span className="bg-slate-200 text-slate-600 text-xs px-2 py-1 rounded-full">{unassigned.length}</span>
              </h2>
              {unassigned.map(order => (
                <div
                  key={order.id}
                  draggable
                  onDragStart={(e) => handleDragStart(e, order, 'unassigned')}
                  className="p-3 mb-3 bg-slate-50 border border-slate-200 rounded-lg cursor-grab hover:border-blue-400 hover:shadow-md transition-all"
                >
                  <div className="font-bold text-slate-800">{order.id}</div>
                  <div className="text-sm text-slate-600 font-medium">{order.customer}</div>
                  <div className="text-xs text-slate-500 mt-1">{order.address}</div>
                  <div className="text-xs text-slate-500 flex justify-between mt-2 items-center">
                    <span className="bg-slate-200 px-2 py-1 rounded">{order.weight}T | {order.zone}</span>
                    {order.gangFlag && <span className="bg-red-100 text-red-800 font-bold px-2 py-1 rounded">🚨 GANG</span>}
                  </div>
                </div>
              ))}
            </div>

            {/* Fleet Zones */}
            {fleet.map(truck => (
              <div
                key={truck.id}
                onDragOver={handleDragOver}
                onDrop={(e) => handleDrop(e, truck.id)}
                className={`p-4 rounded-xl shadow-sm border transition-all duration-300 min-h-[500px] flex flex-col ${truck.isDirty ? 'bg-yellow-50 border-yellow-400' : 'bg-white border-slate-200'}`}
              >
                <div className="flex justify-between items-center mb-2">
                  <h2 className="font-bold text-lg text-slate-800">{truck.id}</h2>
                  <span className="text-xs font-bold bg-slate-800 text-white px-2 py-1 rounded">{truck.type}</span>
                </div>

                <div className="w-full bg-slate-200 rounded-full h-2.5 mb-1 overflow-hidden">
                  <div
                    className={`h-2.5 rounded-full transition-all duration-500 ${truck.currentWeight > (truck.maxWeight * 0.9) ? 'bg-red-500' : 'bg-emerald-500'}`}
                    style={{ width: `${(truck.currentWeight / truck.maxWeight) * 100}%` }}
                  ></div>
                </div>
                <div className="text-xs mb-4 text-slate-500 font-semibold text-right">
                  {truck.currentWeight}T / {truck.maxWeight}T
                </div>

                <div className="flex-1 border-2 border-dashed border-slate-200 rounded-lg p-2 flex flex-col gap-2 bg-slate-50/50">
                   {truck.orders.length === 0 && <span className="text-slate-400 text-sm text-center mt-6">Drop orders here...</span>}
                   {truck.orders.map(order => (
                      <div
                        key={order.id}
                        draggable
                        onDragStart={(e) => handleDragStart(e, order, truck.id)}
                        className="p-3 bg-white border border-slate-200 rounded-lg cursor-grab hover:border-blue-400 shadow-sm"
                      >
                        <div className="font-bold text-sm text-slate-800">{order.id} - {order.customer}</div>
                        <div className="text-xs text-slate-500 mt-1">{order.address}</div>
                        <div className="text-xs text-slate-500 mt-1">{order.weight}T | {order.zone}</div>
                      </div>
                   ))}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<TMSBoard />);
  </script>
</body>
</html>
